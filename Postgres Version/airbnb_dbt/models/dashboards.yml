version: 2

exposures:
  - name: executive_overview
    label: Executive Overview
    type: dashboard
    maturity: low
    url: http://localhost:3000/dashboard/executive-overview
    description: >
      KPI cards, supply and host growth, review volume, room mix, and sentiment
      trend for the Airbnb Berlin market.
    depends_on:
      - ref('mart_executive_kpis')
      - ref('mart_market_monthly')
      - ref('dim_listings')
    owner:
      name: Muhammad Cikal Merdeka
      email: mcikalmerdeka@gmail.com

  - name: supply_pricing
    label: Supply and Pricing
    type: dashboard
    maturity: low
    url: http://localhost:3000/dashboard/supply-pricing
    description: >
      Price distribution, room-type benchmarks, minimum-night segments, and
      superhost pricing comparisons.
    depends_on:
      - ref('mart_price_bands')
      - ref('mart_room_type_benchmark')
      - ref('dim_listings')
    owner:
      name: Muhammad Cikal Merdeka
      email: mcikalmerdeka@gmail.com

  - name: guest_experience
    label: Guest Experience
    type: dashboard
    maturity: low
    url: http://localhost:3000/dashboard/guest-experience
    description: >
      Review volume and seasonality, sentiment trends, and keyword topic
      mentions across guest comments.
    depends_on:
      - ref('mart_review_topics')
      - ref('mart_market_monthly')
      - ref('fct_reviews')
    owner:
      name: Muhammad Cikal Merdeka
      email: mcikalmerdeka@gmail.com

  - name: host_portfolio
    label: Host Portfolio
    type: dashboard
    maturity: low
    url: http://localhost:3000/dashboard/host-portfolio
    description: >
      Portfolio concentration, professional host segments, and superhost
      performance.
    depends_on:
      - ref('mart_host_performance')
      - ref('dim_hosts')
    owner:
      name: Muhammad Cikal Merdeka
      email: mcikalmerdeka@gmail.com

  - name: listing_explorer
    label: Listing Explorer
    type: dashboard
    maturity: low
    url: http://localhost:3000/dashboard/listing-explorer
    description: >
      One-row-per-listing drill-down table for price, activity, review volume,
      and sentiment.
    depends_on:
      - ref('mart_listing_performance')
    owner:
      name: Muhammad Cikal Merdeka
      email: mcikalmerdeka@gmail.com
